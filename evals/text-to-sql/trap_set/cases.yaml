# BI bot trap set, v0.3
#
# Each case is a question someone might ask a BI bot, the behavior a careful
# analyst would show, and a reference query that recomputes the right answer
# at test time (store queries, not numbers: numbers go stale).
#
# Fields
#   expected_behavior     answer | clarify | refuse
#   acceptable_behaviors  every behavior that should pass (defaults to expected)
#   compare               scalar | set | top_n_ordered | none
#   tolerance             relative tolerance for numeric comparison
#   reference_sql         the correct answer, recomputed at run time
#   tempting_sql          the plausible wrong answer a confident bot gives
#   cost_weight           1 to 5, business cost of a confident wrong answer
#   metrics               semantic model metrics the case exercises (coverage)
#   trap                  what makes the case hard, in one line
#
# Dates: the bot's "today" is 2026-10-01; data runs through 2026-09-30.
# NT below stands for the test-account exclusion every query needs:
#   account_id IN (SELECT account_id FROM accounts WHERE NOT is_test)

version: "0.3"
as_of: "2026-10-01"
cases:

# ---------------------------------------------------------------- totals
- id: c01
  question: What was MRR in September 2026?
  category: totals
  expected_behavior: answer
  compare: scalar
  tolerance: 0.000001   # MRR moves <0.1% a month; a loose tolerance passes the wrong month
  cost_weight: 5
  metrics: [mrr]
  reference_sql: |
    SELECT SUM(mrr_usd) FROM mrr_monthly
    WHERE month = DATE '2026-09-01'
      AND account_id IN (SELECT account_id FROM accounts WHERE NOT is_test)

- id: c03
  question: What is our current ARR?
  category: totals
  expected_behavior: answer
  compare: scalar
  tolerance: 0.000001   # MRR moves <0.1% a month; a loose tolerance passes the wrong month
  cost_weight: 5
  metrics: [arr]
  trap: '"current" means the latest complete month, not a sum over the year'
  reference_sql: |
    SELECT SUM(mrr_usd) * 12 FROM mrr_monthly
    WHERE month = DATE '2026-09-01'
      AND account_id IN (SELECT account_id FROM accounts WHERE NOT is_test)
  tempting_sql: |
    SELECT SUM(mrr_usd) FROM mrr_monthly
    WHERE month >= DATE '2025-10-01' AND month < DATE '2026-10-01'
      AND account_id IN (SELECT account_id FROM accounts WHERE NOT is_test)

- id: c04
  question: How much revenue did we collect in Q3 2026?
  category: totals
  expected_behavior: answer
  compare: scalar
  tolerance: 0.001
  cost_weight: 5
  metrics: [revenue]
  trap: revenue means paid invoices only; open, void and refunded invoices do not count
  reference_sql: |
    SELECT SUM(amount_usd) FROM invoices
    WHERE status = 'paid' AND NOT is_deleted
      AND invoice_date >= DATE '2026-07-01' AND invoice_date < DATE '2026-10-01'
      AND account_id IN (SELECT account_id FROM accounts WHERE NOT is_test)
  tempting_sql: |
    SELECT SUM(amount_usd) FROM invoices
    WHERE invoice_date >= DATE '2026-07-01' AND invoice_date < DATE '2026-10-01'

- id: c11
  question: How many new customers did we sign in Q2 2026?
  category: totals
  expected_behavior: answer
  compare: scalar
  tolerance: 0
  cost_weight: 3
  metrics: [new_accounts]
  trap: internal test accounts must be excluded
  reference_sql: |
    SELECT COUNT(*) FROM accounts
    WHERE NOT is_test
      AND created_at >= DATE '2026-04-01' AND created_at < DATE '2026-07-01'
  tempting_sql: |
    SELECT COUNT(*) FROM accounts
    WHERE created_at >= DATE '2026-04-01' AND created_at < DATE '2026-07-01'

- id: c12
  question: How many paying accounts did we have in September 2026?
  category: totals
  expected_behavior: answer
  compare: scalar
  tolerance: 0
  cost_weight: 3
  metrics: [paying_accounts]
  reference_sql: |
    SELECT COUNT(DISTINCT account_id) FROM mrr_monthly
    WHERE month = DATE '2026-09-01' AND mrr_usd > 0
      AND account_id IN (SELECT account_id FROM accounts WHERE NOT is_test)

- id: c17
  question: How many invoices were refunded in 2025?
  category: totals
  expected_behavior: answer
  compare: scalar
  tolerance: 0
  cost_weight: 2
  metrics: [refunded_invoices]
  trap: soft-deleted invoices must be excluded
  reference_sql: |
    SELECT COUNT(*) FROM invoices
    WHERE status = 'refunded' AND NOT is_deleted
      AND invoice_date >= DATE '2025-01-01' AND invoice_date < DATE '2026-01-01'
      AND account_id IN (SELECT account_id FROM accounts WHERE NOT is_test)

- id: c19
  question: How many API calls did EMEA accounts make in Q2 2026?
  category: totals
  expected_behavior: answer
  compare: scalar
  tolerance: 0.001
  cost_weight: 2
  metrics: [api_calls]
  reference_sql: |
    SELECT SUM(u.api_calls) FROM usage_monthly u JOIN accounts a USING (account_id)
    WHERE a.region = 'EMEA' AND NOT a.is_test
      AND u.month >= DATE '2026-04-01' AND u.month < DATE '2026-07-01'

# ---------------------------------------------------------- time windows
- id: c02
  question: What was MRR last month?
  category: time_windows
  expected_behavior: answer
  compare: scalar
  tolerance: 0.000001   # MRR moves <0.1% a month; a loose tolerance passes the wrong month
  cost_weight: 5
  metrics: [mrr]
  trap: relative date; "last month" is September 2026 given today is 2026-10-01
  reference_sql: |
    SELECT SUM(mrr_usd) FROM mrr_monthly
    WHERE month = DATE '2026-09-01'
      AND account_id IN (SELECT account_id FROM accounts WHERE NOT is_test)

- id: c05
  question: What's our year-to-date revenue?
  category: time_windows
  expected_behavior: answer
  compare: scalar
  tolerance: 0.001
  cost_weight: 5
  metrics: [revenue]
  trap: relative date; YTD runs 2026-01-01 through 2026-09-30
  reference_sql: |
    SELECT SUM(amount_usd) FROM invoices
    WHERE status = 'paid' AND NOT is_deleted
      AND invoice_date >= DATE '2026-01-01' AND invoice_date < DATE '2026-10-01'
