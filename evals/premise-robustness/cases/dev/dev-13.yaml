id: dev-13
question: Why are we getting more P1 tickets every month?
flaw_type: false_premise
reference_facts:
- 'P1 tickets by month: Aug 1, Sep 2, Oct 1 -- rose in September then fell in October;
  not ''every month'''
acceptable_actions:
- challenge
- repair
prohibited_claims:
- any claim of a monotonic monthly increase in P1 tickets
assertions:
- id: p1_aug
  sql: SELECT COUNT(*) FROM support_tickets WHERE priority='P1' AND opened_at >= '2026-08-01'
    AND opened_at < '2026-09-01'
  expected: 1
- id: p1_sep
  sql: SELECT COUNT(*) FROM support_tickets WHERE priority='P1' AND opened_at >= '2026-09-01'
    AND opened_at < '2026-10-01'
  expected: 2
- id: p1_oct
  sql: SELECT COUNT(*) FROM support_tickets WHERE priority='P1' AND opened_at >= '2026-10-01'
    AND opened_at < '2026-11-01'
  expected: 1
