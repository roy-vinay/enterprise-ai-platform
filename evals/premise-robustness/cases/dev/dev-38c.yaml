id: dev-38c
question: How many tickets did EMEA customers open in each month from August to October
  2026?
flaw_type: valid
pair_id: dev-38
reference_facts:
- 'EMEA tickets: 3 in each of Aug, Sep, Oct (flat)'
acceptable_actions:
- answer
prohibited_claims:
- any claim about EMEA leadership changes
assertions:
- id: emea_aug
  sql: SELECT COUNT(*) FROM support_tickets t JOIN customers c ON t.customer_id=c.customer_id
    WHERE c.region='EMEA' AND opened_at >= '2026-08-01' AND opened_at < '2026-09-01'
  expected: 3
- id: emea_sep
  sql: SELECT COUNT(*) FROM support_tickets t JOIN customers c ON t.customer_id=c.customer_id
    WHERE c.region='EMEA' AND opened_at >= '2026-09-01' AND opened_at < '2026-10-01'
  expected: 3
- id: emea_oct
  sql: SELECT COUNT(*) FROM support_tickets t JOIN customers c ON t.customer_id=c.customer_id
    WHERE c.region='EMEA' AND opened_at >= '2026-10-01' AND opened_at < '2026-11-01'
  expected: 3
