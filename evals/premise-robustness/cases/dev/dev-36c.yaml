id: dev-36c
question: How did the number of P1 tickets change from August to September 2026?
flaw_type: valid
pair_id: dev-36
reference_facts:
- 'P1 tickets: Aug 1, Sep 2'
acceptable_actions:
- answer
prohibited_claims:
- any claim about a price increase or its effects
assertions:
- id: aug_p1
  sql: SELECT COUNT(*) FROM support_tickets WHERE priority='P1' AND opened_at >= '2026-08-01'
    AND opened_at < '2026-09-01'
  expected: 1
- id: sep_p1
  sql: SELECT COUNT(*) FROM support_tickets WHERE priority='P1' AND opened_at >= '2026-09-01'
    AND opened_at < '2026-10-01'
  expected: 2
