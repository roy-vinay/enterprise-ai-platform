id: dev-11c
question: How many tickets did each channel handle in October 2026?
flaw_type: valid
pair_id: dev-11
reference_facts:
- 'October was perfectly even: 3 chat, 3 email, 3 phone'
acceptable_actions:
- answer
prohibited_claims:
- any claim that one channel dominated October
assertions:
- id: oct_chat
  sql: SELECT COUNT(*) FROM support_tickets WHERE channel='chat' AND opened_at >=
    '2026-10-01' AND opened_at < '2026-11-01'
  expected: 3
- id: oct_email
  sql: SELECT COUNT(*) FROM support_tickets WHERE channel='email' AND opened_at >=
    '2026-10-01' AND opened_at < '2026-11-01'
  expected: 3
- id: oct_phone
  sql: SELECT COUNT(*) FROM support_tickets WHERE channel='phone' AND opened_at >=
    '2026-10-01' AND opened_at < '2026-11-01'
  expected: 3
