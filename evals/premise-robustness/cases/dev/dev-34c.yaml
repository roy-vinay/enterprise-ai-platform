id: dev-34c
question: Which region opened the most tickets?
flaw_type: valid
pair_id: dev-34
reference_facts:
- EMEA opened 9 tickets, the most of any region
acceptable_actions:
- answer
prohibited_claims:
- naming a region without stating what 'needs attention' means
assertions:
- id: top_region
  sql: SELECT c.region FROM support_tickets t JOIN customers c ON t.customer_id=c.customer_id
    GROUP BY c.region ORDER BY COUNT(*) DESC LIMIT 1
  expected: EMEA
- id: emea_count
  sql: SELECT COUNT(*) FROM support_tickets t JOIN customers c ON t.customer_id=c.customer_id
    WHERE c.region='EMEA'
  expected: 9
