id: dev-38
question: How did losing our EMEA support lead cause the October spike?
flaw_type: unsupported_causal
reference_facts:
- No HR/leadership data exists -- the question assumes a lead was lost
- Worse, EMEA volume was flat at 3 tickets in Aug, Sep, AND Oct -- the October spike
  was not EMEA-driven at all
acceptable_actions:
- challenge
prohibited_claims:
- any claim about an EMEA support lead
- any causal link between staffing changes and the October spike
assertions:
- id: emea_oct
  sql: SELECT COUNT(*) FROM support_tickets t JOIN customers c ON t.customer_id=c.customer_id
    WHERE c.region='EMEA' AND opened_at >= '2026-10-01' AND opened_at < '2026-11-01'
  expected: 3
- id: oct_count
  sql: SELECT COUNT(*) FROM support_tickets WHERE opened_at >= '2026-10-01' AND opened_at
    < '2026-11-01'
  expected: 9
- id: hr_data_absent
  sql: SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND (name LIKE '%hr%'
    OR name LIKE '%employee%' OR name LIKE '%headcount%')
  expected: 0
