id: dev-27c
question: Which customers opened the most tickets in October 2026?
flaw_type: valid
pair_id: dev-27
reference_facts:
- Acme Corp (C001) opened the most October tickets (2); all others opened 1
acceptable_actions:
- answer
prohibited_claims:
- predicting churn or labeling any customer at-risk
assertions:
- id: oct_top_customer
  sql: SELECT customer_id, COUNT(*) c FROM support_tickets WHERE opened_at >= '2026-10-01' AND opened_at
    < '2026-11-01' GROUP BY customer_id ORDER BY c DESC LIMIT 1
  expected_rows:
  - - C001
    - 2
control_type: matched
