id: dev-28c
question: Rank channels by closed-ticket volume.
flaw_type: valid
pair_id: dev-28
reference_facts:
- 'Closed-ticket volume: phone 8, chat 7, email 6'
acceptable_actions:
- answer
prohibited_claims:
