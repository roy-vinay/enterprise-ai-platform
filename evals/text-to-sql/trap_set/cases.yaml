# ------------------------------------------------------------------- traps
- id: c20
  question: What was total MRR in 2025?
  category: traps
  expected_behavior: clarify
  acceptable_behaviors: [clarify, answer]
  compare: scalar
  tolerance: 0.001
  cost_weight: 5
  metrics: [mrr]
  trap: MRR is a snapshot; summing twelve months is meaningless. Ask, or give December 2025 MRR
  reference_sql: |
    SELECT SUM(mrr_usd) FROM mrr_monthly
    WHERE month = DATE '2025-12-01'
      AND account_id IN (SELECT account_id FROM accounts WHERE NOT is_test)
  tempting_sql: |
    SELECT SUM(mrr_usd) FROM mrr_monthly
    WHERE month >= DATE '2025-01-01' AND month < DATE '2026-01-01'
      AND account_id IN (SELECT account_id FROM accounts WHERE NOT is_test)

- id: c25
  question: How many customers canceled because of bugs in 2026?
  category: traps
  expected_behavior: clarify
  acceptable_behaviors: [clarify, refuse]
  compare: none
  cost_weight: 4
  metrics: [churned_accounts]
  trap: there is no "bugs" cancel reason; mapping it to missing_feature is a silent substitution
  tempting_sql: |
    SELECT COUNT(DISTINCT account_id) FROM subscriptions
    WHERE status = 'canceled' AND cancel_reason = 'missing_feature'
      AND end_date >= DATE '2026-01-01' AND end_date < DATE '2027-01-01'
      AND account_id IN (SELECT account_id FROM accounts WHERE NOT is_test)

- id: c27
  question: What's our churn rate?
  category: traps
  expected_behavior: clarify
  acceptable_behaviors: [clarify, refuse]
  compare: none
  cost_weight: 4
  metrics: [churned_accounts]
  trap: no churn rate is defined (logo vs revenue, which period, which denominator)
  tempting_sql: |
    SELECT COUNT(*) FILTER (WHERE status = 'canceled') * 100.0 / COUNT(*) FROM subscriptions

- id: c26
  question: How are we doing this quarter?
  category: traps
  expected_behavior: clarify
  compare: none
  cost_weight: 2
  metrics: []
  trap: no metric named; any number is a guess
  tempting_sql: |
    SELECT SUM(amount_usd) FROM invoices
    WHERE status = 'paid' AND invoice_date >= DATE '2026-07-01' AND invoice_date < DATE '2026-10-01'

- id: c29
  question: Among Enterprise accounts that opened at least one support ticket in Q3 2026, what was the average number of tickets per account?
  category: traps
  expected_behavior: answer
  compare: scalar
  tolerance: 0.000001
  cost_weight: 3
  metrics: [support_tickets]
  trap: AVG(ticket_id) averages ID numbers; both real models made this mistake on a01 (v0.2 runs)
  reference_sql: |
    SELECT AVG(n) FROM (
      SELECT t.account_id, COUNT(*) AS n
      FROM support_tickets t JOIN accounts a USING (account_id)
      WHERE a.segment = 'Enterprise' AND NOT a.is_test
        AND t.created_at >= DATE '2026-07-01' AND t.created_at < DATE '2026-10-01'
      GROUP BY t.account_id)
  tempting_sql: |
    SELECT AVG(t.ticket_id)
    FROM support_tickets t JOIN accounts a USING (account_id)
    WHERE a.segment = 'Enterprise' AND NOT a.is_test
      AND t.created_at >= DATE '2026-07-01' AND t.created_at < DATE '2026-10-01'

