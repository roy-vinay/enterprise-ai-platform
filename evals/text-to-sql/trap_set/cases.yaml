- id: c16
  question: How many support tickets did each segment open in 2025?
  category: breakdowns
  expected_behavior: answer
  compare: set
  tolerance: 0
  cost_weight: 2
  metrics: [support_tickets]
  reference_sql: |
    SELECT a.segment, COUNT(*)
    FROM support_tickets t JOIN accounts a USING (account_id)
    WHERE NOT a.is_test
