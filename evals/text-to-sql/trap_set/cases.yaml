  expected_behavior: answer
  acceptable_behaviors: [answer, clarify]
  compare: scalar
  tolerance: 0
  cost_weight: 3
  metrics: [paying_accounts]
  trap: '"active" is ambiguous (paying vs using the product); the model maps it to paying accounts, and asking is also fine'
  reference_sql: |
    SELECT COUNT(DISTINCT account_id) FROM mrr_monthly
    WHERE month = DATE '2026-09-01' AND mrr_usd > 0
