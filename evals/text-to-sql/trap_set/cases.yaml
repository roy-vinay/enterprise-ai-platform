  tempting_sql: |
    SELECT COUNT(DISTINCT account_id) FROM subscriptions
    WHERE status = 'canceled' AND canceled_by = 'customer'
      AND end_date >= DATE '2026-07-01' AND end_date < DATE '2026-10-01'
