# ---------------------------------------------------------------- rankings
- id: c07
  question: Top 5 accounts by revenue in 2025
  category: rankings
  expected_behavior: answer
  compare: top_n_ordered
  tolerance: 0.001
  cost_weight: 3
  metrics: [revenue]
  reference_sql: |
    SELECT a.name, SUM(i.amount_usd) AS revenue
    FROM invoices i JOIN accounts a USING (account_id)
    WHERE i.status = 'paid' AND NOT i.is_deleted AND NOT a.is_test
      AND i.invoice_date >= DATE '2025-01-01' AND i.invoice_date < DATE '2026-01-01'
    GROUP BY a.name ORDER BY revenue DESC LIMIT 5

# ------------------------------------------------------------------- rates
- id: c15
  question: What was average CSAT for urgent tickets in Q3 2026?
  category: rates
  expected_behavior: answer
  compare: scalar
  tolerance: 0.005
  cost_weight: 2
  metrics: [avg_csat]
  trap: tickets without a score must be ignored, not counted as zero
  reference_sql: |
    SELECT AVG(csat_score) FROM support_tickets
    WHERE priority = 'urgent' AND csat_score IS NOT NULL
      AND created_at >= DATE '2026-07-01' AND created_at < DATE '2026-10-01'
      AND account_id IN (SELECT account_id FROM accounts WHERE NOT is_test)
  tempting_sql: |
    SELECT SUM(COALESCE(csat_score, 0)) * 1.0 / COUNT(*) FROM support_tickets
    WHERE priority = 'urgent'
      AND created_at >= DATE '2026-07-01' AND created_at < DATE '2026-10-01'
      AND account_id IN (SELECT account_id FROM accounts WHERE NOT is_test)

- id: c18
  question: What was month-over-month MRR growth in September 2026, as a percent?
  category: rates
  expected_behavior: answer
  compare: scalar
  tolerance: 0.01
  cost_weight: 4
  metrics: [mrr]
  reference_sql: |
    WITH m AS (
      SELECT month, SUM(mrr_usd) AS v FROM mrr_monthly
      WHERE month IN (DATE '2026-08-01', DATE '2026-09-01')
        AND account_id IN (SELECT account_id FROM accounts WHERE NOT is_test)
      GROUP BY month)
    SELECT (MAX(v) FILTER (WHERE month = DATE '2026-09-01')
          / MAX(v) FILTER (WHERE month = DATE '2026-08-01') - 1) * 100 FROM m

# ----------------------------------------------------- definitions (churn)
- id: c08
