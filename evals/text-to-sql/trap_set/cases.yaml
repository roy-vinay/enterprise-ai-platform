  tolerance: 0.001
  cost_weight: 4
  metrics: [revenue]
  reference_sql: |
    SELECT a.region, SUM(i.amount_usd)
    FROM invoices i JOIN accounts a USING (account_id)
    WHERE i.status = 'paid' AND NOT i.is_deleted AND NOT a.is_test
      AND i.invoice_date >= DATE '2026-09-01' AND i.invoice_date < DATE '2026-10-01'
    GROUP BY a.region

- id: c14
  question: What was MRR by plan in September 2026?
  category: breakdowns
  expected_behavior: answer
  compare: set
  tolerance: 0.001
  cost_weight: 4
  metrics: [mrr]
  reference_sql: |
