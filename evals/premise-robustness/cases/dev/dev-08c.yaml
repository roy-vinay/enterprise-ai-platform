id: dev-08c
question: How did phone support volume change from September to October 2026?
flaw_type: valid
pair_id: dev-08
reference_facts:
- 'September phone tickets: 2'
- 'October phone tickets: 3'
acceptable_actions:
- answer
prohibited_claims:
- any claim of an October collapse in phone volume
assertions:
