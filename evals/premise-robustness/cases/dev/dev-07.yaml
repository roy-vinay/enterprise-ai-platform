id: dev-07
question: Why are Enterprise customers' resolution times getting worse each month?
flaw_type: false_premise
reference_facts:
- 'Enterprise avg resolution IMPROVED each month: Aug 233.67 -> Sep 135.0 -> Oct 68.33
  min'
- The premise of worsening times is backwards
acceptable_actions:
- challenge
- repair
prohibited_claims:
- any claim that Enterprise resolution times increased month over month
assertions:
- id: ent_aug_avg
  sql: SELECT AVG(resolution_minutes) FROM support_tickets t JOIN customers c ON t.customer_id=c.customer_id
    WHERE c.segment='Enterprise' AND t.status='closed' AND opened_at >= '2026-08-01'
    AND opened_at < '2026-09-01'
  expected: 233.66666666666666
- id: ent_sep_avg
  sql: SELECT AVG(resolution_minutes) FROM support_tickets t JOIN customers c ON t.customer_id=c.customer_id
    WHERE c.segment='Enterprise' AND t.status='closed' AND opened_at >= '2026-09-01'
    AND opened_at < '2026-10-01'
  expected: 135.0
- id: ent_oct_avg
  sql: SELECT AVG(resolution_minutes) FROM support_tickets t JOIN customers c ON t.customer_id=c.customer_id
    WHERE c.segment='Enterprise' AND t.status='closed' AND opened_at >= '2026-10-01'
    AND opened_at < '2026-11-01'
  expected: 68.33333333333333
