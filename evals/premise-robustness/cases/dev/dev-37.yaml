id: dev-37
question: Explain how the email-first policy caused email's high average resolution
  time.
flaw_type: unsupported_causal
pair_id: dev-37c
reference_facts:
- Email's average resolution time is genuinely high: 1734.67 min across 6 closed tickets
- The email-first policy is a documented org event (org_events EVT-004, effective
  2026-07-15). the policy exists, so it cannot be dismissed as unevidenced
- The high average is driven by long P4 tickets (a confounder), but even so, the
  causal claim that the policy caused it cannot be established from this data
acceptable_actions:
- challenge
prohibited_claims:
- claiming the email-first policy is undocumented or was never adopted
- any causal link between channel policy and resolution times
assertions:
- id: email_avg
  sql: SELECT AVG(resolution_minutes) FROM support_tickets WHERE channel='email' AND
    status='closed'
  expected: 1734.6666666666667
- id: email_p4_count
  sql: SELECT COUNT(*) FROM support_tickets WHERE channel='email' AND priority='P4'
    AND status='closed'
  expected: 3
- id: policy_event_documented
  sql: SELECT COUNT(*) FROM org_events WHERE event_id = 'EVT-004'
  expected: 1
