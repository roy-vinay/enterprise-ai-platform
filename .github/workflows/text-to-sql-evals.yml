name: text-to-sql evals

on:
  pull_request:
    paths: ["evals/text-to-sql/**", ".github/workflows/text-to-sql-evals.yml"]
  push:
    branches: [main]
    paths: ["evals/text-to-sql/**"]
  schedule:
    - cron: "17 9 * * *"   # nightly
  workflow_dispatch:
    inputs:
      ollama_model:
        description: "Also run against a real local model (leave empty to skip)"
        required: false
        default: ""

defaults:
  run:
    working-directory: evals/text-to-sql

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/text-to-sql/requirements.txt
      - run: pip install -r requirements.txt
      - name: Build synthetic warehouse
        run: python -m t2s_eval.cli build-data
      - name: Test the eval itself
        run: python -m pytest -q tests
      - name: Lint the trap set (every case must catch its tempting wrong answer)
        run: python -m t2s_eval.cli lint
      - name: Semantic model regression gate
        run: python -m t2s_eval.cli gate
      - name: Full report (simulated bots, mutation testing)
        if: always()
        run: python -m t2s_eval.cli run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-to-sql-report
          path: evals/text-to-sql/reports/latest

  ollama:
    if: github.event_name == 'workflow_dispatch' && inputs.ollama_model != ''
    runs-on: ubuntu-latest
    timeout-minutes: 330   # CPU-only runners are slow; ~200 model calls per run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install Ollama and pull model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull "${{ inputs.ollama_model }}"
      - run: python -m t2s_eval.cli build-data
      - name: Evaluate a real model
        run: python -m t2s_eval.cli run --bot ollama --model "${{ inputs.ollama_model }}" --runs 3 --skip-mutation --out reports/ollama
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-to-sql-report-ollama
          path: evals/text-to-sql/reports/ollama
