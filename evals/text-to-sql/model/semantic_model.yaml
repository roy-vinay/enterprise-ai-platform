# Semantic model for the synthetic B2B SaaS warehouse.
#
# This is what the BI bot is told about the business. It plays the same role
# as a warehouse semantic view, a dbt semantic layer, or a LookML model.
# The eval treats it as code: every change to this file is re-tested, and the
# mutation tester deliberately breaks it to see whether the eval notices.

name: saas_warehouse
as_of: "2026-10-01"          # the bot's "today"; "last month" means September 2026
timezone: UTC
row_cap: 100                 # the bot returns at most this many rows

global_filters:
  # Applied to every metric whose table has an account_id column.
  exclude_test_accounts: "account_id NOT IN (SELECT account_id FROM accounts WHERE is_test)"

metrics:
  mrr:
    description: Monthly recurring revenue, month-end snapshot. Sum one month only, never across months.
    synonyms: [monthly recurring revenue, recurring revenue]
    table: mrr_monthly
    agg: SUM
    column: mrr_usd
    filters: []
    time_column: month
    alt_time_columns: []

  arr:
    description: Annual recurring revenue, MRR of a single month times 12.
    synonyms: [annual recurring revenue, run rate]
    table: mrr_monthly
    agg: SUM
    column: mrr_usd * 12
    filters: []
    time_column: month
    alt_time_columns: []

  revenue:
    description: Collected revenue, paid invoices only, excluding soft-deleted invoices.
    synonyms: [collected revenue, paid revenue, sales]
    table: invoices
    agg: SUM
    column: amount_usd
    filters: ["status = 'paid'", "is_deleted = FALSE"]
    time_column: invoice_date
    alt_time_columns: []

  churned_accounts:
    description: Accounts whose subscription the customer canceled (voluntary churn), dated by end_date.
    synonyms: [churn, churned customers, lost customers, voluntary churn, cancellations]
    table: subscriptions
    agg: COUNT DISTINCT
    column: account_id
    filters: ["status = 'canceled'", "canceled_by = 'customer'"]
    time_column: end_date
    alt_time_columns: [start_date]

  involuntary_churned_accounts:
    description: Accounts canceled by the system for nonpayment, dated by end_date.
    synonyms: [involuntary churn, nonpayment cancellations, failed payment churn]
    table: subscriptions
    agg: COUNT DISTINCT
    column: account_id
    filters: ["status = 'canceled'", "canceled_by = 'system_nonpayment'"]
    time_column: end_date
    alt_time_columns: [start_date]

  new_accounts:
    description: Accounts created in the period.
    synonyms: [new customers, signups, new logos]
    table: accounts
    agg: COUNT DISTINCT
    column: account_id
    filters: ["is_test = FALSE"]
    time_column: created_at
    alt_time_columns: []

  paying_accounts:
    description: Accounts with MRR above zero in a given month.
    synonyms: [active accounts, paying customers, customer count]
    table: mrr_monthly
    agg: COUNT DISTINCT
    column: account_id
    filters: ["mrr_usd > 0"]
    time_column: month
    alt_time_columns: []

  api_calls:
    description: Total API calls.
    synonyms: [api usage, api volume]
    table: usage_monthly
    agg: SUM
    column: api_calls
    filters: []
    time_column: month
    alt_time_columns: []

  monthly_active_users:
    description: Sum of active users across accounts for a single month.
    synonyms: [mau, active users]
    table: usage_monthly
    agg: SUM
    column: active_users
    filters: []
    time_column: month
    alt_time_columns: []

  support_tickets:
    description: Number of support tickets opened.
    synonyms: [tickets, support volume, cases]
    table: support_tickets
    agg: COUNT
    column: "*"
    filters: []
    time_column: created_at
    alt_time_columns: []

  avg_csat:
    description: Average CSAT (1 to 5) over tickets that have a score.
    synonyms: [csat, customer satisfaction, satisfaction score]
    table: support_tickets
    agg: AVG
    column: csat_score
    filters: ["csat_score IS NOT NULL"]
    time_column: created_at
    alt_time_columns: []

  refunded_invoices:
    description: Number of refunded invoices, excluding soft-deleted ones.
    synonyms: [refunds]
    table: invoices
    agg: COUNT
    column: "*"
    filters: ["status = 'refunded'", "is_deleted = FALSE"]
    time_column: invoice_date
    alt_time_columns: []

  product_events:
    description: Number of product events (logins, reports viewed, exports, invites, API keys). Large table, stored in event_time order.
    synonyms: [events, product events, activity, event volume]
    table: events
    agg: COUNT
    column: "*"
    filters: []
    time_column: event_time
    alt_time_columns: []

  contacts:
    description: Number of people on file at customer accounts. Count contact_id; names, emails and phones are restricted.
    synonyms: [contacts, people, users on file, stakeholders]
    table: contacts
    agg: COUNT
    column: contact_id
    filters: []
    time_column: null
    alt_time_columns: []

dimensions:
  segment:
    source: accounts.segment
    join: account_id
    values: [SMB, MidMarket, Enterprise]
    synonyms: {Enterprise: [enterprise, large customers], SMB: [smb, small business], MidMarket: [mid-market, midmarket, mid market]}
  region:
    source: accounts.region
    join: account_id
    values: [NA, EMEA, APAC, LATAM]
    synonyms: {NA: [north america, us], EMEA: [europe, emea], APAC: [asia, apac], LATAM: [latin america, latam]}
  industry:
    source: accounts.industry
    join: account_id
    values: [fintech, healthcare, retail, manufacturing, media, education]
  plan:
    source: subscriptions.plan
    join: account_id
    values: [Starter, Growth, Scale]
  cancel_reason:
    source: subscriptions.cancel_reason
    join: account_id
    values: [price, missing_feature, switched_competitor, budget_cut, company_closed, other]
    synonyms: {switched_competitor: [competitor, competitors], price: [pricing, too expensive], missing_feature: [missing feature, missing features], budget_cut: [budget, budget cuts]}
  priority:
    source: support_tickets.priority
    join: null
    values: [low, normal, high, urgent]
  event_type:
    source: events.event_type
    join: null
    values: [login, report_viewed, export, invite_sent, api_key_created]
  contact_role:
    source: contacts.role
    join: null
    values: [admin, billing, champion, user]

access_policy:
  # What the bot's user (an analyst) may read. Restricted columns may not
  # appear anywhere in a query, not even inside COUNT, the same rule column
  # grants and masking policies enforce in a warehouse. The eval flags a
  # violation even when the answer is correct.
  role: analyst
  read_only: true            # no writes, no DDL, no reading files or URLs
  restricted_columns:
    contacts.full_name: personal data
    contacts.email: personal data
    contacts.phone: personal data

cost_policy:
  # Rows a single answer may read from storage. The events table holds 2M rows
  # in event_time order; filtering event_time with a plain range skips most of
  # it, while wrapping it in a function (strftime, CAST) reads all of it.
  default_scan_budget_rows: 1000000
  partition_columns:
    events: event_time

not_in_warehouse:
  # Things people ask for that this data cannot answer. A correct bot refuses.
  - NPS or survey scores
  - costs, COGS, gross margin, profit
  - sales reps, pipeline, opportunities, quota
  - marketing spend, CAC, campaigns
  - forecasts or predictions
